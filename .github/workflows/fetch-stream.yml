name: Fetch Stream URL

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scrape for .m3u8 streams'
        required: false
        default: 'https://news.abplive.com/live-tv'
      timeout:
        description: 'Scrape timeout in seconds'
        required: false
        default: '30'
      quiet:
        description: 'Suppress non-essential output (only show results)'
        type: boolean
        required: false
        default: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          TIMEOUT: ${{ github.event.inputs.timeout }}
        run: python scrape_m3u8.py${{ github.event.inputs.quiet && ' --quiet' || '' }}
